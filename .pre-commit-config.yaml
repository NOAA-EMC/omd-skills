repos:
  - repo: local
    hooks:
      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
      - id: shellcheck
        name: shellcheck
        entry: shellcheck -x
        language: system
        files: ^(unpack|install)\.sh$|^tools/installer/.*\.sh$
      - id: ruff
        name: ruff
        entry: ruff check
        language: system
        types: [python]
      - id: markdownlint
        name: markdownlint
        entry: markdownlint --config .markdownlint.json
        language: system
        files: ^(README\.md|CONTRIBUTING\.md|docs/getting_started\.md|\.github/instructions/.*\.md)$
