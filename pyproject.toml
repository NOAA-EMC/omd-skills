[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omd-skills"
dynamic = ["version"]
description = "NOAA OMD AI-agent skill catalog with a multi-agent installer CLI (Claude Code, Codex, OpenCode, Gemini CLI, Cursor, Copilot)"
readme = "README.md"
requires-python = ">=3.8"
authors = [
  { name = "NOAA Ocean Modeling Division", email = "barry.baker@noaa.gov" },
]
keywords = ["ai-agents", "skills", "claude", "codex", "cursor", "gemini", "copilot", "noaa", "installer"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: Public Domain",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Documentation",
]

[project.urls]
Homepage = "https://github.com/NOAA-EMC/omd-skills"
Repository = "https://github.com/NOAA-EMC/omd-skills"
Documentation = "https://github.com/NOAA-EMC/omd-skills/blob/develop/docs/agent-install.md"

[project.scripts]
omd-skills = "omd_skills.cli:main"

[tool.hatch.version]
path = "src/omd_skills/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/omd_skills"]

# The catalog payload (install.sh + libs + skills + instructions) is copied
# into src/omd_skills/templates/ by the hatch_build.py hook at build time and
# is git-ignored; force-include it in wheels and sdists.
[tool.hatch.build]
artifacts = ["src/omd_skills/templates/**"]

[tool.hatch.build.targets.sdist]
# Ship the whole repository content in the sdist as well (minus caches).
exclude = [
  "/.git",
  "**/__pycache__",
  "**/.DS_Store",
]
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
target-version = "py38"
line-length = 100
extend-exclude = [
  "src/omd_skills/templates",  # build-time catalog payload mirror; lint the originals
]

# Default ruff lint set (E4/E7/E9/F); py3.8-compatible. Add rules deliberately.

[tool.ruff.lint]
# Explicit rule set keeps CI deterministic across ruff releases; new default
# rules from newer versions must be adopted deliberately, not implicitly.
select = ["E4", "E7", "E9", "F"]
